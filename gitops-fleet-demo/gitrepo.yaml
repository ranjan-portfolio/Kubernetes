# This is NOT picked up automatically by Fleet - it's the resource YOU apply
# directly to the cluster (kubectl apply -f gitrepo.yaml) to tell Fleet to start
# watching this repo. Keeping it here in-repo is just for reference/history.
#
# Must be applied in the fleet-local namespace so it targets the same cluster
# Fleet itself is running on (standalone Fleet's default local-cluster workspace).
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: k8s-gitops-demo
  namespace: fleet-local
spec:
  repo: https://github.com/ranjan-portfolio/Kubernetes.git
  branch: main
  paths:
    - gitops-fleet-demo/platform/prometheus
    - gitops-fleet-demo/app/vote-app
  pollingInterval: 15s 
